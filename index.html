<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tâilingo 台語學習</title>
<style>
  :root {
    --green: #58cc02;
    --green-dark: #46a302;
    --green-light: #d7ffb8;
    --blue: #1cb0f6;
    --blue-dark: #0099cc;
    --red: #ff4b4b;
    --red-light: #ffd5d5;
    --yellow: #ffc800;
    --gray: #afafaf;
    --gray-light: #f7f7f7;
    --text: #3c3c3c;
    --white: #ffffff;
    --border: #e5e5e5;
    --shadow: rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
    background: #f0f4f8;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* SCREENS */
  .screen { display: none; width: 100%; max-width: 480px; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* HOME */
  #home {
    background: linear-gradient(160deg, #58cc02 0%, #46a302 50%, #2d7a01 100%);
    justify-content: center; align-items: center;
    padding: 2rem 1.5rem;
    gap: 1.5rem;
  }
  .home-logo { font-size: 5rem; }
  .home-title { color: white; font-size: 2rem; font-weight: 800; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
  .home-sub { color: rgba(255,255,255,0.85); font-size: 1rem; text-align: center; }
  .home-stats {
    display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    background: rgba(255,255,255,0.15); border-radius: 12px; padding: 1rem 1.5rem;
  }
  .stat-item { text-align: center; color: white; }
  .stat-num { font-size: 1.5rem; font-weight: 800; }
  .stat-label { font-size: 0.75rem; opacity: 0.85; }

  /* BUTTONS */
  .btn {
    border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
    cursor: pointer; padding: 0.9rem 2rem; transition: all 0.15s; width: 100%;
    letter-spacing: 0.02em;
  }
  .btn:active { transform: translateY(2px); }
  .btn-primary { background: white; color: var(--green-dark); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .btn-primary:active { box-shadow: none; }
  .btn-green { background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-dark); }
  .btn-green:disabled { background: var(--gray); color: white; box-shadow: 0 4px 0 #888; cursor: default; }
  .btn-green:not(:disabled):active { box-shadow: none; }
  .btn-outline { background: white; color: var(--green); border: 2px solid var(--green); }
  .btn-row { display: flex; gap: 0.75rem; width: 100%; }

  /* MENU */
  #menu {
    background: white; padding: 0;
  }
  .menu-header {
    background: var(--green); padding: 1.5rem 1.25rem 1rem;
    color: white;
  }
  .menu-header h2 { font-size: 1.3rem; font-weight: 800; }
  .menu-header p { font-size: 0.85rem; opacity: 0.85; margin-top: 0.25rem; }
  .menu-hud {
    display: flex; gap: 1rem; margin-top: 0.75rem;
    font-size: 0.85rem; font-weight: 700;
  }
  .hud-pill {
    background: rgba(255,255,255,0.2); border-radius: 20px;
    padding: 0.25rem 0.75rem; display: flex; align-items: center; gap: 0.35rem;
  }
  .units-grid { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; overflow-y: auto; }
  .unit-card {
    border: 2px solid var(--border); border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .unit-header {
    padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .unit-color-0 { background: #e8f9d9; border-color: var(--green); }
  .unit-color-1 { background: #ddf4ff; border-color: var(--blue); }
  .unit-color-2 { background: #fff8dd; border-color: var(--yellow); }
  .unit-color-3 { background: #ffe8e8; border-color: var(--red); }
  .unit-color-4 { background: #f0e8ff; border-color: #9b59b6; }
  .unit-name { font-weight: 800; font-size: 1rem; }
  .unit-prog { font-size: 0.8rem; color: var(--gray); }
  .unit-arrow { font-size: 1.2rem; transition: transform 0.2s; }
  .unit-card.open .unit-arrow { transform: rotate(90deg); }
  .unit-lessons { padding: 0 0.75rem 0.75rem; display: none; gap: 0.5rem; flex-direction: column; }
  .unit-card.open .unit-lessons { display: flex; }
  .lesson-btn {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.85rem;
    background: white; border: 2px solid var(--border); border-radius: 10px;
    cursor: pointer; transition: all 0.15s;
  }
  .lesson-btn:active { transform: scale(0.98); }
  .lesson-btn.done { border-color: var(--green); background: var(--green-light); }
  .lesson-btn.locked { opacity: 0.45; cursor: default; }
  .lesson-icon { font-size: 1.5rem; }
  .lesson-info { flex: 1; }
  .lesson-title { font-weight: 700; font-size: 0.9rem; }
  .lesson-count { font-size: 0.75rem; color: var(--gray); }
  .lesson-stars { color: var(--yellow); font-size: 0.85rem; }

  /* QUIZ */
  #quiz { background: white; }
  .quiz-top {
    padding: 0.85rem 1rem 0.5rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .btn-back {
    background: none; border: none; font-size: 1.4rem; cursor: pointer;
    color: var(--gray); padding: 0.25rem; border-radius: 8px;
    transition: background 0.15s;
  }
  .btn-back:hover { background: var(--gray-light); }
  .progress-bar-wrap { flex: 1; background: var(--border); border-radius: 99px; height: 14px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s; }
  .hearts { font-size: 1.1rem; white-space: nowrap; }

  .quiz-body { flex: 1; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; }
  .quiz-type-badge {
    display: inline-block; background: var(--gray-light); color: var(--gray);
    font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.7rem; border-radius: 20px; text-transform: uppercase;
  }
  .quiz-question { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
  .quiz-char-display {
    background: var(--gray-light); border-radius: 16px; padding: 1.25rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    border: 2px solid var(--border);
  }
  .quiz-char { font-size: 3.5rem; font-weight: 700; line-height: 1; }
  .quiz-tailo { font-size: 1.15rem; color: var(--blue); font-weight: 600; }
  .quiz-char-display.show-tailo .quiz-tailo { display: block; }
  .quiz-tailo { display: none; }
  .quiz-hint { font-size: 0.8rem; color: var(--gray); }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
  .option-btn {
    border: 2px solid var(--border); border-radius: 12px; padding: 0.9rem 0.6rem;
    background: white; cursor: pointer; font-size: 0.95rem; font-weight: 600;
    transition: all 0.15s; text-align: center; line-height: 1.3;
    min-height: 3.2rem; display: flex; align-items: center; justify-content: center;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.selected { border-color: var(--blue); background: #e8f6ff; color: var(--blue-dark); }
  .option-btn.correct { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
  .option-btn.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); }

  .quiz-footer {
    padding: 1rem 1.25rem; border-top: 2px solid var(--border);
  }
  .feedback-box {
    border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.85rem;
    display: none;
  }
  .feedback-box.correct-fb { background: var(--green-light); border: 2px solid var(--green); }
  .feedback-box.wrong-fb { background: var(--red-light); border: 2px solid var(--red); }
  .feedback-title { font-weight: 800; font-size: 1rem; }
  .feedback-title.correct-text { color: var(--green-dark); }
  .feedback-title.wrong-text { color: var(--red); }
  .feedback-detail { font-size: 0.85rem; margin-top: 0.3rem; color: var(--text); }

  /* RESULT */
  #result { background: white; justify-content: center; align-items: center; padding: 2rem 1.5rem; gap: 1.5rem; }
  .result-icon { font-size: 5rem; }
  .result-title { font-size: 1.8rem; font-weight: 800; text-align: center; }
  .result-sub { color: var(--gray); text-align: center; font-size: 0.95rem; }
  .result-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;
    background: var(--gray-light); border-radius: 14px; padding: 1rem; width: 100%;
  }
  .r-stat { text-align: center; }
  .r-stat-num { font-size: 1.5rem; font-weight: 800; }
  .r-stat-label { font-size: 0.75rem; color: var(--gray); margin-top: 0.2rem; }
  .num-green { color: var(--green); }
  .num-red { color: var(--red); }
  .num-blue { color: var(--blue); }
  .result-xp { background: var(--green-light); border: 2px solid var(--green); border-radius: 12px; padding: 0.75rem 1.5rem; font-weight: 800; color: var(--green-dark); font-size: 1.1rem; }

  /* RESPONSIVE */
  @media (max-width: 380px) {
    .quiz-char { font-size: 2.8rem; }
    .option-btn { font-size: 0.85rem; padding: 0.75rem 0.4rem; }
  }

  /* LOADING */
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #333; color: white; padding: 0.6rem 1.2rem; border-radius: 99px;
    font-size: 0.9rem; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none;
    white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .quiz-sub { font-size: 1.05rem; color: var(--blue); font-weight: 600; }
  .quiz-cloze { font-size: 1.5rem; font-weight: 700; line-height: 1.5; text-align: center; }
  .quiz-hint-zh { font-size: 0.9rem; color: var(--gray); }
  .fb-link { display: inline-block; margin-top: 0.4rem; font-size: 0.8rem; color: var(--blue-dark); }
  .btn-review { background: var(--yellow); color: #5a4300; box-shadow: 0 4px 0 #c79a00; }
  .btn-review:active { box-shadow: none; }
  .btn-review:disabled { background: var(--border); color: var(--gray); box-shadow: 0 4px 0 #ccc; cursor: default; }
  .wod { width: 100%; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 0.8rem 1rem; color: white; text-align: center; }
  .wod-label { font-size: 0.75rem; opacity: 0.85; }
  .wod-word { font-size: 2rem; font-weight: 800; }
  .wod-tailo { font-size: 1rem; }
  .wod a { color: white; font-size: 0.8rem; opacity: 0.9; }
  .menu-review { padding: 1rem 1rem 0; }
  .lesson-btn.next { border-color: var(--blue); box-shadow: 0 0 0 2px #cfeeff; }
  .miss-list { width: 100%; background: var(--red-light); border-radius: 12px; padding: 0.75rem 1rem; font-size: 0.9rem; display: none; }
  .miss-list b { color: var(--red); }
  .miss-item { margin-top: 0.3rem; }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <div class="home-logo">🦜</div>
  <div class="home-title">Tâilingo</div>
  <div class="home-sub">教育部臺灣台語推薦用字 700字詞</div>
  <div class="home-stats">
    <div class="stat-item"><div class="stat-num">700</div><div class="stat-label">字詞</div></div>
    <div class="stat-item"><div class="stat-num" id="h-learned">0</div><div class="stat-label">已學</div></div>
    <div class="stat-item"><div class="stat-num" id="h-due">0</div><div class="stat-label">待複習</div></div>
    <div class="stat-item"><div class="stat-num" id="h-streak">0</div><div class="stat-label">連續天</div></div>
  </div>
  <div class="wod" id="wod"></div>
  <button class="btn btn-primary" id="btn-start">開始學習</button>
  <button class="btn btn-review" id="btn-review-home">複習到期字詞</button>
  <button class="btn btn-outline" style="background:transparent;color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.5)" id="btn-reset">重置進度</button>
</div>

<!-- MENU SCREEN -->
<div id="menu" class="screen">
  <div class="menu-header">
    <h2>台語學習地圖</h2>
    <p>教育部臺灣台語推薦用字 700字詞（依拼音字母排序）</p>
    <div class="menu-hud">
      <div class="hud-pill">🔥 <span id="m-streak">0</span> 天</div>
      <div class="hud-pill">⭐ <span id="m-xp">0</span> XP</div>
      <div class="hud-pill">💎 <span id="m-learned">0</span>/700</div>
    </div>
  </div>
  <div class="menu-review"><button class="btn btn-review" id="btn-review-menu">複習到期字詞</button></div>
  <div class="units-grid" id="units-grid"></div>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz" class="screen">
  <div class="quiz-top">
    <button class="btn-back" id="btn-exit">✕</button>
    <div class="progress-bar-wrap"><div class="progress-bar" id="q-progress" style="width:0%"></div></div>
    <div class="hearts" id="q-hearts"></div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-footer" id="quiz-footer">
    <div class="feedback-box" id="feedback-box">
      <div class="feedback-title" id="fb-title"></div>
      <div class="feedback-detail" id="fb-detail"></div>
      <a class="fb-link" id="fb-link" target="_blank" rel="noopener" style="display:none">到辭典查看／聽發音 ↗</a>
    </div>
    <button class="btn btn-green" id="btn-check" disabled>確認</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="result" class="screen">
  <div class="result-icon" id="r-icon">🎉</div>
  <div class="result-title" id="r-title"></div>
  <div class="result-sub" id="r-sub"></div>
  <div class="result-stats">
    <div class="r-stat"><div class="r-stat-num num-green" id="r-correct">0</div><div class="r-stat-label">答對</div></div>
    <div class="r-stat"><div class="r-stat-num num-red" id="r-wrong">0</div><div class="r-stat-label">答錯</div></div>
    <div class="r-stat"><div class="r-stat-num num-blue" id="r-xp">0</div><div class="r-stat-label">XP</div></div>
  </div>
  <div class="miss-list" id="miss-list"></div>
  <div style="width:100%;display:flex;flex-direction:column;gap:0.75rem">
    <button class="btn btn-green" id="btn-continue">回到地圖</button>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
// 來源：教育部《臺灣台語推薦用字700字詞》字表（113年8月修正）
// Format: [建議用字, 音讀(臺羅), 對應華語, 用例, 又音]
const WORDS = [
  ["阿","a","阿","阿母、阿爸",""],
  ["阿妗","a-kīm","舅媽","阮阿舅佮阿妗咧做生理",""],

  ["偝","āinn","背（人）","偝囡仔、偝巾","iāng"],
  ["沃","ak","澆、淋","沃花、沃雨",""],
  ["泔","ám","稀的、米湯","糜傷泔、泔糜仔、漿泔",""],
  ["頷頸","ām-kún","脖子、頸項","頷頸筋、頷頸伸長長、頷頸生瘤──拄著",""],
  ["按呢","án-ne","這樣、如此","按呢做、按呢生",""],
  ["按怎","án-tsuánn","怎麼、怎樣","按怎樣、按怎講、按怎寫","àn-tsuánn/án-nuá/án-ná"],
  ["絚","ân","緊、不寬裕","縛絚絚、手頭絚",""],
  ["翁","ang","丈夫","翁某、翁婿",""],
  ["尪仔","ang-á","玩偶、人像","布袋戲尪仔、尪仔標",""],
  ["遏","at","折斷","遏斷、遏樹枝",""],

  ["䆀","bái","不好、醜","心情䆀、環境䆀、真䆀",""],
  ["目","ba̍k","眼","目鏡、目眉",""],
  ["茉莉","ba̍k-nī","茉莉","六月茉莉真清芳","bāng-lē"],
  ["目屎","ba̍k-sái","眼淚","傷心流目屎",""],

  ["密","ba̍t","密","草仔發甲真密、密密密",""],
  ["袂","bē","不、不能、不會","袂食袂睏、袂行、袂來","buē"],

  ["雺","bông","大霧","罩雺、起雺、雺霧",""],

  ["舞","bú","舞、胡搞","跳舞、烏白舞",""],

const LESSON_SIZE = 10;
const UNIT_SIZE = 100;
const MAX_LIVES = 5;
const DAY = 86400000;
const BOX_DAYS = [0, 1, 2, 4, 8, 16];
const DICT_URL = w => 'https://sutian.moe.edu.tw/zh-hant/tshiau/?lui=tai_su&tsha=' + encodeURIComponent(w);

const $ = id => document.getElementById(id);
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const initial = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').charAt(0).toLowerCase();

// ─── SOUND ───────────────────────────────────────────────────────────────────
let audioCtx = null;
function playTones(notes, type, volume, length) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    notes.forEach(([freq, delay]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0 + delay);
      gain.gain.exponentialRampToValueAtTime(volume, t0 + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + length);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0 + delay);
      osc.stop(t0 + delay + length + 0.05);
    });
  } catch (e) {}
}
const playCorrect = () => playTones([[659.25, 0], [987.77, 0.1]], 'sine', 0.25, 0.35);   // E5 → B5 上揚雙音
const playWrong = () => playTones([[220, 0], [155.56, 0.14]], 'triangle', 0.3, 0.3);     // A3 → D♯3 下沉雙音

// ─── CONFETTI ────────────────────────────────────────────────────────────────
const confetti = (() => {
  const COLORS = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#9b59b6', '#ff9ad5'];
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let canvas = null, ctx = null, parts = [], raf = 0;

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter(p => p.life > 0 && p.y < canvas.height + 30);
    parts.forEach(p => {
      p.vy += 0.35; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life / 25);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
      ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(frame) : 0;
    if (!raf) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 從 (ox, oy) 往上噴出彩帶
  return function burst(ox, oy, count = 70) {
    if (reduceMotion) return;
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200';
      document.body.appendChild(canvas);
      ctx = canvas.getContext('2d');
    }
    canvas.width = innerWidth; canvas.height = innerHeight;
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;   // 向上扇形
      const speed = 8 + Math.random() * 9;
      parts.push({
        x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 10,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)], life: 70 + Math.random() * 40,
      });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  };
})();

// ─── STATE ───────────────────────────────────────────────────────────────────
const STORE_KEY = 'taigi_state_v2';
let state = freshState();
function freshState() {
  return { xp: 0, streak: 0, lastDate: null, completed: {}, srs: {} };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) state = { ...freshState(), ...s };
  } catch (e) {}
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - DAY).toDateString();
  if (state.lastDate !== today && state.lastDate !== yesterday) state.streak = 0;
}
function bumpStreak() {
  const today = new Date().toDateString();
  if (state.lastDate === today) return;
  const yesterday = new Date(Date.now() - DAY).toDateString();
  state.streak = state.lastDate === yesterday ? state.streak + 1 : 1;
  state.lastDate = today;
}
function resetProgress() {
  if (!confirm('確定要重置所有進度嗎？')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  state = freshState();
  showScreen('home');
}
const learnedCount = () => Object.keys(state.srs).length;
function dueIds() {
  const now = Date.now();
  return Object.entries(state.srs)
    .filter(([, v]) => v.due <= now)
    .sort((a, b) => a[1].due - b[1].due)
    .map(([id]) => +id);
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  if (id === 'menu') renderMenu();
  if (id === 'home') renderHome();
  window.scrollTo(0, 0);
}

function renderHome() {
  $('h-learned').textContent = learnedCount();
  $('h-due').textContent = dueIds().length;
  $('h-streak').textContent = state.streak;
  $('btn-review-home').disabled = dueIds().length === 0;
  const day = Math.floor(Date.now() / DAY);
  const w = W[(day * 7919) % W.length];
  $('wod').innerHTML = `<div class="wod-label">今日一詞</div>
    <div class="wod-word">${w.w}</div><div class="wod-tailo">${w.t}</div>
    <div>${w.z}</div><a href="${DICT_URL(w.w)}" target="_blank" rel="noopener">查辭典聽發音 ↗</a>`;
}

// ─── MENU ────────────────────────────────────────────────────────────────────
const LESSON_COUNT = Math.ceil(W.length / LESSON_SIZE);
const lessonWords = li => W.slice(li * LESSON_SIZE, (li + 1) * LESSON_SIZE);

function renderMenu() {
  $('m-streak').textContent = state.streak;
  $('m-xp').textContent = state.xp;
  $('m-learned').textContent = learnedCount();
  const due = dueIds().length;
  const rb = $('btn-review-menu');
  rb.disabled = due === 0;
  rb.textContent = due ? `複習到期字詞（${due}）` : '目前沒有需要複習的字詞';

  const nextLesson = [...Array(LESSON_COUNT).keys()].find(li => !state.completed[li]);
  const perUnit = UNIT_SIZE / LESSON_SIZE;
  const grid = $('units-grid');
  grid.innerHTML = '';
  for (let ui = 0; ui * perUnit < LESSON_COUNT; ui++) {
    const first = ui * perUnit;
    const last = Math.min(first + perUnit, LESSON_COUNT) - 1;
    const fw = W[first * LESSON_SIZE], lw = W[Math.min((last + 1) * LESSON_SIZE, W.length) - 1];
    const done = [...Array(last - first + 1).keys()].filter(i => state.completed[first + i]).length;
    const card = document.createElement('div');
    card.className = 'unit-card' + (nextLesson >= first && nextLesson <= last ? ' open' : '');
    card.innerHTML = `
      <div class="unit-header unit-color-${ui % 5}">
        <div>
          <div class="unit-name">單元 ${ui + 1}　${initial(fw.t).toUpperCase()}–${initial(lw.t).toUpperCase()}</div>
          <div class="unit-prog">${done}/${last - first + 1} 課完成</div>
        </div>
        <div class="unit-arrow">›</div>
      </div>
      <div class="unit-lessons"></div>`;
    card.querySelector('.unit-header').addEventListener('click', () => card.classList.toggle('open'));
    const box = card.querySelector('.unit-lessons');
    for (let li = first; li <= last; li++) {
      const ws = lessonWords(li);
      const stars = state.completed[li] || 0;
      const btn = document.createElement('div');
      btn.className = 'lesson-btn' + (stars ? ' done' : '') + (li === nextLesson ? ' next' : '');
      btn.innerHTML = `
        <div class="lesson-icon">${stars ? '⭐' : '📖'}</div>
        <div class="lesson-info">
          <div class="lesson-title">課程 ${li + 1}：${ws.slice(0, 5).map(w => w.w).join(' ')}…</div>
          <div class="lesson-count">${ws.length} 個字詞 · 編號 ${ws[0].id + 1}–${ws[ws.length - 1].id + 1}</div>
        </div>
        ${stars ? `<div class="lesson-stars">${'⭐'.repeat(stars)}</div>` : ''}`;
      btn.addEventListener('click', () => startSession(ws, { lesson: li }));
      box.appendChild(btn);
    }
    grid.appendChild(card);
  }
}

function startReview() {
  const ids = dueIds().slice(0, LESSON_SIZE);
  if (!ids.length) return;
  startSession(ids.map(i => W[i]), { review: true });
}

// ─── QUESTIONS ───────────────────────────────────────────────────────────────
let quiz = null;

const tokens = z => z.split(/[、，,（）()]/).filter(Boolean);

function distractors(word, key, n = 3) {
  const seen = new Set([word[key]]);
  const bad = key === 'z' ? new Set(tokens(word.z)) : null;
  const out = [];
  for (const c of shuffle(W)) {
    if (c.w === word.w || seen.has(c[key])) continue;
    if (bad && tokens(c.z).some(t => bad.has(t))) continue;
    seen.add(c[key]);
    out.push(c[key]);
    if (out.length === n) break;
  }
  return out;
}

function clozeSentence(word) {
  const parts = word.e.split(/[、，。；]/).map(s => s.trim()).filter(Boolean);
  const hit = shuffle(parts).find(p => p.includes(word.w) && p.length > word.w.length);
  return hit ? hit.replace(word.w, '＿＿') : null;
}

function buildQuestion(word, type) {
  const mk = (key, correct) => ({ word, type, correct, options: shuffle([correct, ...distractors(word, key)]) });
  switch (type) {
    case 'w2z': return { ...mk('z', word.z), prompt: '這個詞的華語意思是？', display: word.w, sub: word.t };
    case 'w2t': return { ...mk('t', word.t), prompt: '這個詞的臺羅拼音是？', display: word.w, hint: word.z };
    case 'z2w': return { ...mk('w', word.w), prompt: '「' + word.z + '」的台語怎麼寫？' };
    case 't2w': return { ...mk('w', word.w), prompt: '臺羅「' + word.t + '」是哪個詞？', hint: word.z };
    case 'cloze': return { ...mk('w', word.w), prompt: '選出適合填入空格的詞', cloze: clozeSentence(word), hint: '意思：' + word.z };
  }
}
const TYPE_LABEL = { w2z: '詞→意思', w2t: '詞→拼音', z2w: '意思→詞', t2w: '拼音→詞', cloze: '填空' };

function pickType(word, round) {
  const pool = round === 0 ? ['w2z', 'w2t'] : ['z2w', 't2w'];
  if (round === 1 && clozeSentence(word)) pool.push('cloze', 'cloze');
  return pool[Math.floor(Math.random() * pool.length)];
}

// ─── SESSION ─────────────────────────────────────────────────────────────────
function startSession(words, meta) {
  const qs = [];
  words.forEach(w => { qs.push(buildQuestion(w, pickType(w, 0))); qs.push(buildQuestion(w, pickType(w, 1))); });
  quiz = {
    meta, words, queue: shuffle(qs), current: 0, lives: MAX_LIVES,
    correct: 0, wrong: 0, selected: null, answered: false, stats: {},
  };
  showScreen('quiz');
  renderQuestion();
}

function renderHearts() {
  $('q-hearts').textContent = '❤️'.repeat(quiz.lives) + '🖤'.repeat(MAX_LIVES - quiz.lives);
}

function renderQuestion() {
  const q = quiz.queue[quiz.current];
  $('q-progress').style.width = (quiz.current / quiz.queue.length * 100) + '%';
  renderHearts();
  const fb = $('feedback-box');
  fb.style.display = 'none'; fb.className = 'feedback-box';
  const btn = $('btn-check');
  btn.disabled = true; btn.textContent = '確認';
  quiz.selected = null; quiz.answered = false;

  const body = $('quiz-body');
  body.innerHTML = '';
  const add = (cls, text) => { const el = document.createElement('div'); el.className = cls; el.textContent = text; body.appendChild(el); };
  add('quiz-type-badge', TYPE_LABEL[q.type]);
  add('quiz-question', q.prompt);
  if (q.display) {
    const box = document.createElement('div');
    box.className = 'quiz-char-display';
    const ch = document.createElement('div'); ch.className = 'quiz-char'; ch.textContent = q.display;
    box.appendChild(ch);
    if (q.sub) { const s = document.createElement('div'); s.className = 'quiz-sub'; s.textContent = q.sub; box.appendChild(s); }
    body.appendChild(box);
  }
  if (q.cloze) {
    const box = document.createElement('div');
    box.className = 'quiz-char-display';
    const c = document.createElement('div'); c.className = 'quiz-cloze'; c.textContent = q.cloze;
    box.appendChild(c);
    body.appendChild(box);
  }
  if (q.hint) add('quiz-hint-zh', q.type === 'cloze' ? q.hint : '提示：' + q.hint);
  const grid = document.createElement('div');
  grid.className = 'options-grid';
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = opt;
    b.addEventListener('click', () => selectOption(b, opt));
    grid.appendChild(b);
  });
  body.appendChild(grid);
}

function selectOption(btn, val) {
  if (quiz.answered) return;
  quiz.selected = val;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.toggle('selected', b === btn));
  $('btn-check').disabled = false;
}

function checkAnswer() {
  if (quiz.answered) { nextQuestion(); return; }
  if (quiz.selected === null) return;
  const q = quiz.queue[quiz.current];
  const ok = quiz.selected === q.correct;
  quiz.answered = true;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.classList.remove('selected');
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b.textContent === quiz.selected) b.classList.add('wrong');
    b.style.pointerEvents = 'none';
  });

  const st = quiz.stats[q.word.id] || (quiz.stats[q.word.id] = { right: 0, wrong: 0 });
  const fb = $('feedback-box');
  fb.style.display = 'block';
  if (ok) {
    quiz.correct++; st.right++;
    playCorrect();
    const r = $('btn-check').getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top);
    fb.className = 'feedback-box correct-fb';
    $('fb-title').className = 'feedback-title correct-text';
    $('fb-title').textContent = '正確！';
  } else {
    quiz.wrong++; st.wrong++; quiz.lives--;
    playWrong();
    fb.className = 'feedback-box wrong-fb';
    $('fb-title').className = 'feedback-title wrong-text';
    $('fb-title').textContent = '答錯了！';
    renderHearts();
    // 答錯的字稍後換個題型再出現一次
    quiz.queue.push(buildQuestion(q.word, pickType(q.word, Math.random() < 0.5 ? 0 : 1)));
  }
  const w = q.word;
  $('fb-detail').textContent = `${w.w}　${w.t}　＝　${w.z}` + (w.e ? `\n例：${w.e}` : '');
  $('fb-detail').style.whiteSpace = 'pre-line';
  const link = $('fb-link');
  link.href = DICT_URL(w.w); link.style.display = 'inline-block';

  const btn = $('btn-check');
  btn.textContent = quiz.lives <= 0 || quiz.current >= quiz.queue.length - 1 ? '完成' : '繼續 →';
  btn.disabled = false;
}

function nextQuestion() {
  if (quiz.lives <= 0) { finishSession(false); return; }
  quiz.current++;
  if (quiz.current >= quiz.queue.length) { finishSession(true); return; }
  renderQuestion();
}

// ─── RESULT ──────────────────────────────────────────────────────────────────
function applySrs() {
  const now = Date.now();
  Object.entries(quiz.stats).forEach(([id, st]) => {
    const cur = state.srs[id] || { box: 0, due: now };
    const box = st.wrong > 0 ? 0 : Math.min(cur.box + 1, BOX_DAYS.length - 1);
    state.srs[id] = { box, due: now + (st.wrong > 0 ? 10 * 60000 : BOX_DAYS[box] * DAY) };
  });
}

function finishSession(finished) {
  const total = quiz.correct + quiz.wrong;
  const accuracy = total ? quiz.correct / total : 0;
  const stars = finished ? (accuracy >= 0.9 ? 3 : accuracy >= 0.7 ? 2 : 1) : 0;
  const xp = finished ? 10 + quiz.correct * 2 : quiz.correct;

  applySrs();
  state.xp += xp;
  if (total) bumpStreak();
  if (finished && quiz.meta.lesson !== undefined) {
    state.completed[quiz.meta.lesson] = Math.max(state.completed[quiz.meta.lesson] || 0, stars);
  }
  saveState();

  $('r-icon').textContent = finished ? (accuracy >= 0.8 ? '🎉' : '👍') : '💪';
  $('r-title').textContent = finished ? (accuracy >= 0.8 ? '太棒了！' : '做得好！') : '繼續加油！';
  $('r-sub').textContent = finished ? `獲得 ${stars} 顆星` : '愛心用完了，已作答的字詞已記錄進度';
  $('r-correct').textContent = quiz.correct;
  $('r-wrong').textContent = quiz.wrong;
  $('r-xp').textContent = xp;

  const missed = Object.entries(quiz.stats).filter(([, s]) => s.wrong > 0).map(([id]) => W[id]);
  const ml = $('miss-list');
  ml.style.display = missed.length ? 'block' : 'none';
  ml.innerHTML = '<b>需要加強的字詞（已排入複習）</b>';
  missed.forEach(w => {
    const d = document.createElement('div');
    d.className = 'miss-item';
    d.textContent = `${w.w}　${w.t}　${w.z}`;
    ml.appendChild(d);
  });
  showScreen('result');
}

// ─── INIT ────────────────────────────────────────────────────────────────────
$('btn-start').addEventListener('click', () => showScreen('menu'));
$('btn-reset').addEventListener('click', resetProgress);
$('btn-review-home').addEventListener('click', startReview);
$('btn-review-menu').addEventListener('click', startReview);
$('btn-check').addEventListener('click', checkAnswer);
$('btn-exit').addEventListener('click', () => showScreen('menu'));
$('btn-continue').addEventListener('click', () => showScreen('menu'));
loadState();
renderHome();
</script>
</body>
</html>
